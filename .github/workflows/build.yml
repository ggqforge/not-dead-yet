# ============================================================================
#  打 tag 自动构建并发布
#
#  用法：推一个 v 开头的 tag
#      git tag v1.0.1
#      git push --tags
#  云端会自动编译、创建 Release、把 jar 挂上去，不用手动传文件。
#
#  也可以在 GitHub 仓库的 Actions 页面点 "Run workflow" 手动触发：
#  那种情况只做构建、把 jar 存成可下载的产物，不会创建 Release。
# ============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 项目的 gradlew 是定制版，默认会把 Gradle 缓存放到项目内的 .gradle-home
      # （该目录已在 .gitignore 里）。这里显式固定下来，好让下面的缓存步骤命中。
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 缓存 Gradle 与 Loom（Minecraft、映射，约 0.4GB）
        uses: actions/cache@v4
        with:
          path: .gradle-home
          key: "gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}"
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 校验 tag 与 gradle.properties 的版本是否一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DECLARED=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "tag 里的版本        = $TAG"
          echo "gradle.properties  = $DECLARED"
          if [ "$TAG" != "$DECLARED" ]; then
            echo "::error::版本不一致：tag 是 v$TAG，但 gradle.properties 里的 mod_version 是 $DECLARED。"
            echo "::error::请先把 gradle.properties 的 mod_version 改成 $TAG 并 git push，"
            echo "::error::然后删掉这个 tag 重新打：git tag -d v$TAG && git push origin :v$TAG && git tag v$TAG && git push --tags"
            exit 1
          fi

      - name: 构建
        # 刻意不走 ./gradlew：GitHub 的 runner 上预装了 gradle，而这个定制脚本
        # 会优先使用它，版本可能与本项目固定的 8.12 不一致。
        # 直接调用 wrapper，保证和本地用同一个 Gradle 版本。
        run: |
          java -Xmx64m -classpath gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain build --stacktrace

      - name: 整理要发布的文件（排除 sources / dev jar）
        run: |
          mkdir -p release-assets
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar) ;;
              *) cp "$f" release-assets/ ;;
            esac
          done
          ls -l release-assets

      - name: 保存构建产物（手动触发时也能下载）
        uses: actions/upload-artifact@v4
        with:
          name: not-dead-yet-jar
          path: release-assets/*.jar

      - name: 创建 Release 并上传 jar
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.jar
          generate_release_notes: true
          draft: false

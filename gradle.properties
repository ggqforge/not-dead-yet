# 构建环境
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 模组信息
# 注意：这里必须用下划线命名，build.gradle 里是按 project.mod_id / project.mod_version 读取的。
# Gradle 不会把 mod.id 这样的点号属性映射成 mod_id。
mod_id=notdeadyet
mod_name=Not Dead Yet
mod_version=1.1.1
maven_group=com.example.notdeadyet
archives_base_name=not-dead-yet

# 目标版本（Minecraft 1.21.1）
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.5

# 依赖版本
# 本模组不依赖 Fabric API，因此已从 build.gradle 移除；如需使用可恢复下面这行。
# fabric_version=0.116.17+1.21.1

# Loom
loom_version=1.9.2
